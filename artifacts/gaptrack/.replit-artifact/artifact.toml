kind = "web"
previewPath = "/"
title = "GapTrack"
description = "منصة ويب عربية لمتابعة الشحنات وتفسير فجوات الإشارة وتحليل مناطق ضعف التغطية."
version = "1.0.0"
id = "artifacts/gaptrack"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24928

[services.development]
run = "php -S 0.0.0.0:$PORT -t public"

[services.production]
build = [ "php", "scripts/check.php" ]
run = "php -S 0.0.0.0:$PORT -t public"

[services.env]
PORT = "24928"
